server:
  port: 8082

spring:
  application:
    name: speech-service
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.example.speechservice: DEBUG
    org.springframework.web: DEBUG

openai:
  api:
    api-key: ${OPENAI_API_KEY:your-api-key-here}
